name: Service CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_sdk:
        description: Explicitly allow publishing an exact missing dependency SDK
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependency:
    permissions:
      contents: write
    uses: ./.github/workflows/ffmpeg.yml
    with:
      publish_sdk: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_sdk == true }}
  service:
    needs: dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Capture exact application source and unique image identity
        run: |
          mkdir -p out
          tree=$(python3 scripts/release-manifest.py source --output out/source-inputs.json)
          echo "SOURCE_TREE_SHA256=$tree" >> "$GITHUB_ENV"
          echo "RUNTIME_TAG=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 tests/checks/release_manifest_test.py
      - name: Download exact FFmpeg SDK
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ needs.dependency.outputs.tag }}
        run: |
          mkdir -p out
          gh release download "$SDK_TAG" -p 'ffmpeg-sdk.tar.gz*' -D out
          sha256sum -c out/ffmpeg-sdk.tar.gz.sha256
          echo "DEPENDENCY_KEY=${SDK_TAG#ffmpeg-linux-amd64-}" >> "$GITHUB_ENV"
      - name: Build application and matching debug files (no FFmpeg compilation)
        run: |
          # Generate the independent expectation from the trusted full checkout.
          # SDK/release-key fixtures run in the full test entry point (with Git).
          python3 scripts/sdk-expected.py generate --output out/expected-sdk.json
          docker build --target test --build-arg FFMPEG_STAGE=ffmpeg-prebuilt \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg DEPENDENCY_KEY="$DEPENDENCY_KEY" \
            -t naki-live-transcode:test .
          docker build --target runtime --build-arg FFMPEG_STAGE=ffmpeg-prebuilt \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg DEPENDENCY_KEY="$DEPENDENCY_KEY" \
            --build-arg SOURCE_TREE_SHA256="$SOURCE_TREE_SHA256" --build-arg BUILD_RUN_ID="$GITHUB_RUN_ID" \
            --build-arg BUILD_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -t naki-live-transcode:local -t "naki-live-transcode:$RUNTIME_TAG" .
          docker build --target symbols --build-arg FFMPEG_STAGE=ffmpeg-prebuilt \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg DEPENDENCY_KEY="$DEPENDENCY_KEY" \
            --output type=local,dest=out/symbols .
      - name: Media, observation, recovery, bounded crash collection and offline symbols
        run: |
          mkdir -p out/ci-results
          docker run --rm --init -e NAKI_SOURCE_REVISION="$GITHUB_SHA" -v "$PWD/out/ci-results:/src/out/results" naki-live-transcode:test \
            python3 scripts/collect-test-evidence.py --destination out/results -- bash scripts/ci-test.sh
      - name: Application and yyjson ASan UBSan checks
        run: |
          docker run --rm --init -e NAKI_SOURCE_REVISION="$GITHUB_SHA" -v "$PWD/out/ci-results:/src/out/results" naki-live-transcode:test \
            python3 scripts/collect-test-evidence.py --destination out/results -- bash scripts/test-sanitizers.sh
      - name: Runtime image recovery and source-line symbolization
        env:
          NAKI_SYMBOLS_DIR: ${{ github.workspace }}/out/symbols
          NAKI_SMOKE_TOOLS_IMAGE: naki-live-transcode:test
        run: |
          python3 tests/integration/docker_smoke.py
      - name: Package exact image and separate symbols
        run: |
          mkdir -p out/release
          docker save "naki-live-transcode:$RUNTIME_TAG" | gzip -1 > out/release/image-linux-amd64.tar.gz
          tar -C out/symbols -czf out/release/symbols-linux-amd64.tar.gz .
          docker image inspect "naki-live-transcode:$RUNTIME_TAG" > out/release/image.json
          printf '%s\n' "$GITHUB_SHA" > out/release/source-revision.txt
          printf '%s\n' "$DEPENDENCY_KEY" > out/release/ffmpeg-dependency-key.txt
          cp scripts/symbolize-crash.py out/release/
          cp out/source-inputs.json out/release/
          # Compare the actual stripped image ELF files to separately archived
          # Build ID DWARF. Overlay its native libraries onto the sealed SDK;
          # SDK verification then rejects any different runtime library bytes.
          mkdir -p out/release-sdk out/release-runtime-bin
          tar -xzf out/ffmpeg-sdk.tar.gz -C out/release-sdk ./install
          container=$(docker create "naki-live-transcode:$RUNTIME_TAG")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/." out/release-runtime-bin/
          docker cp "$container:/opt/naki-build/install/lib/." out/release-sdk/install/lib/
          python3 scripts/release-manifest.py create --source out/source-inputs.json \
            --runtime-bin out/release-runtime-bin --sdk-prefix out/release-sdk/install \
            --app-symbols out/symbols/app --ffmpeg-symbols out/symbols/ffmpeg --vvenc-symbols out/symbols/vvenc \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --dependency-key "$DEPENDENCY_KEY" \
            --image-inspect out/release/image.json --image-archive out/release/image-linux-amd64.tar.gz \
            --symbols-archive out/release/symbols-linux-amd64.tar.gz --output out/release/release-manifest.json
          python3 scripts/release-manifest.py verify --manifest out/release/release-manifest.json \
            --runtime-bin out/release-runtime-bin --sdk-prefix out/release-sdk/install \
            --app-symbols out/symbols/app --ffmpeg-symbols out/symbols/ffmpeg --vvenc-symbols out/symbols/vvenc \
            --image-inspect out/release/image.json --artifact-directory out/release
          (cd out/release && sha256sum *.tar.gz *.json *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Preserve main build permanently in a prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=build-linux-amd64-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          gh release create "$tag" out/release/* --target "$GITHUB_SHA" --prerelease \
            --title "Experimental linux/amd64 ${GITHUB_SHA:0:12} run $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --notes "Tested image plus separate Build ID debug files. docker load < image-linux-amd64.tar.gz. FFmpeg/VVenC SDK: $DEPENDENCY_KEY. Debug data for application, custom FFmpeg and VVenC is included; distribution libraries require matching external debug packages."
          echo "Image and symbols: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            out/ci-results/
            out/docker-smoke-*/
          retention-days: 14
          if-no-files-found: ignore
