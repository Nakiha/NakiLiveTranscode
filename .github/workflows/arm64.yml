name: Linux ARM64 build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The pinned VVenC fork is private. The token needs read access to
          # this checkout and its submodules.
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install native build and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config \
            libx264-dev libsrt-openssl-dev libssl-dev zlib1g-dev libevent-dev \
            libcurl4-openssl-dev libunwind-dev ffmpeg
      - name: Build service from pinned sources
        run: |
          test "$(uname -m)" = aarch64
          bash scripts/build-service.sh
      - name: Check native binaries, SDK binding and media paths
        run: |
          bash scripts/test-service.sh quick
          bash scripts/test-service.sh full --suite service --suite vvenc
